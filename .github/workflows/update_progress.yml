name: Update Translation Progress

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'game/tl/ukrainian/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main Branch
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Translate Utils
      run: pip install git+https://github.com/KlymentievMaksym/unusual-translate-utils.git

    - name: Run Progress Script
      run: gwt-status ./game/tl/ukrainian --update-readme ./README.md

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs(translation status): auto-update translation status in README.md"
        file_pattern: 'README.md'
