name: Update Translation Progress

on:
  push:
    branches:
      - main
    paths:
      - 'game/tl/ukrainian/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Main Branch
      uses: actions/checkout@v4
      with:
        ref: main
    - name: Checkout Utils Branch
      uses: actions/checkout@v4
      with:
        ref: utils
        path: utils-tools

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Dependencies
      run: |
        if [ -f utils-tools/pyproject.toml ]; then pip install -e ./utils-tools/; fi

    - name: Run Progress Script
      run: check_translation_progress ./game/tl/ukrainian --update-readme

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs(translation status): auto-update translation status in README.md"
        file_pattern: 'README.md'
