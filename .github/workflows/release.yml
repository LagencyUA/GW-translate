
name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Changelog Entry
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          # Перевіряємо, чи це тестовий реліз
          if [[ "$TAG_NAME" == *-test ]]; then
            IS_TEST=true
            RELEASE_TAG="${TAG_NAME%-test}"
          else
            IS_TEST=false
            RELEASE_TAG="$TAG_NAME"
          fi

          VERSION="${RELEASE_TAG#v}"

          # Шукаємо відповідний запис у CHANGELOG.md
          awk -v version="$VERSION" '
            BEGIN {
              header = "## [" version "]"
            }

            substr($0, 1, length(header)) == header {
              found = 1
            }

            found && NR > 1 && $0 ~ /^## \[/ &&
              substr($0, 1, length(header)) != header {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Не знайдено запис для версії $VERSION у CHANGELOG.md"
            exit 1
          fi

          echo "IS_TEST=${IS_TEST}" >> "$GITHUB_ENV"

          echo "Release notes:"
          cat release-notes.md

      - name: Prepare Clean Release Archive
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="Goddesses_Whim_UA_${TAG_NAME}.zip"

          mkdir -p build/game/tl/ukrainian

          cp -r game/tl/ukrainian/. build/game/tl/ukrainian/

          [ -d "icons" ] && cp -r icons build/
          [ -f "README.md" ] && cp README.md build/
          [ -f "LICENSE" ] && cp LICENSE build/

          cd build
          zip -r "../${ARCHIVE_NAME}" .
          cd ..

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          body_path: release-notes.md
          draft: ${{ endsWith(github.ref_name, '-test') }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          title: "Локалізація ${{ github.ref_name }}"
          generate_release_notes: false