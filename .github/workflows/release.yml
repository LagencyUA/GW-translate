name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Changelog Entry
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
            }
            found && NR > 1 && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Не знайдено запис для версії $VERSION у CHANGELOG.md"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Prepare Clean Release Archive
        run: |
          TAG_NAME="${{ github.ref_name }}"
          ARCHIVE_NAME="Goddesses_Whim_UA_${TAG_NAME}.zip"

          mkdir -p build/game/tl/ukrainian

          cp -r game/tl/ukrainian/* build/game/tl/ukrainian/

          [ -d "icons" ] && cp -r icons build/
          [ -f "README.md" ] && cp README.md build/
          [ -f "LICENSE" ] && cp LICENSE build/

          cd build
          zip -r "../${ARCHIVE_NAME}" .
          cd ..

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          title: "Локалізація ${{ github.ref_name }}"
          generate_release_notes: false